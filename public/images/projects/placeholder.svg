<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>

    <!-- Accent Subtle Glow -->
    <radialGradient id="accentGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>

    <!-- Crosshair Pattern -->
    <pattern id="crosshairGrid" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 0 160 L 160 160 M 160 0 L 160 160" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.03"/>
      <path d="M 156 160 L 164 160 M 160 156 L 160 164" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="1600" height="900" fill="#09090b"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <rect width="1600" height="900" fill="url(#accentGlow)"/>

  <!-- Technical Grids -->
  <rect width="1600" height="900" fill="url(#dotGrid)"/>
  <rect width="1600" height="900" fill="url(#crosshairGrid)"/>

  <!-- Subtle UI Blueprint Skeleton Layout in Background -->
  <!-- Top App Navigation Skeleton -->
  <rect x="120" y="80" width="1360" height="52" rx="10" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.05"/>
  <circle cx="150" cy="106" r="6" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="170" cy="106" r="6" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="190" cy="106" r="6" fill="#ffffff" fill-opacity="0.07"/>
  <rect x="230" y="98" width="140" height="16" rx="4" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="1360" y="98" width="90" height="16" rx="4" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Left Sidebar Wireframe -->
  <rect x="120" y="152" width="220" height="668" rx="10" fill="#ffffff" fill-opacity="0.015" stroke="#ffffff" stroke-opacity="0.04"/>
  <rect x="144" y="180" width="172" height="14" rx="4" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="144" y="210" width="140" height="12" rx="3" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="144" y="234" width="156" height="12" rx="3" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="144" y="258" width="120" height="12" rx="3" fill="#ffffff" fill-opacity="0.03"/>
  <rect x="144" y="282" width="164" height="12" rx="3" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Main Content Dashboard Wireframe -->
  <rect x="360" y="152" width="1120" height="668" rx="10" fill="#ffffff" fill-opacity="0.01" stroke="#ffffff" stroke-opacity="0.04"/>

  <!-- Top KPI Cards Skeleton -->
  <rect x="390" y="180" width="330" height="120" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04"/>
  <rect x="755" y="180" width="330" height="120" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04"/>
  <rect x="1120" y="180" width="330" height="120" rx="8" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.04"/>

  <!-- Central Visual Area Outline -->
  <rect x="390" y="324" width="1060" height="466" rx="8" fill="#ffffff" fill-opacity="0.015" stroke="#ffffff" stroke-dasharray="6 6" stroke-opacity="0.06"/>

  <!-- Center Focal Placeholder Card (Glassmorphism) -->
  <g transform="translate(800, 480)">
    <!-- Glow Backdrop -->
    <ellipse cx="0" cy="0" rx="260" ry="140" fill="#facc15" fill-opacity="0.05"/>

    <!-- Glass Container -->
    <rect x="-240" y="-120" width="480" height="240" rx="20" fill="#0d0d10" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="-239" y="-119" width="478" height="238" rx="19" fill="none" stroke="#facc15" stroke-opacity="0.15"/>

    <!-- Corner Crosshairs -->
    <path d="M -225 -105 L -215 -105 M -225 -105 L -225 -95" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 225 -105 L 215 -105 M 225 -105 L 225 -95" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M -225 105 L -215 105 M -225 105 L -225 95" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.5"/>
    <path d="M 225 105 L 215 105 M 225 105 L 225 95" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- Wireframe Camera / Canvas Icon -->
    <g transform="translate(0, -42)">
      <rect x="-26" y="-20" width="52" height="40" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="10" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3 3"/>
      <circle cx="14" cy="-10" r="2.5" fill="#facc15" fill-opacity="0.7"/>
    </g>

    <!-- Typography -->
    <text x="0" y="24" font-family="'DM Sans', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="0.08em">
      SCREENSHOT PLACEHOLDER
    </text>

    <!-- Subtitle -->
    <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" letter-spacing="0.05em">
      16:9 • High-res interface capture in progress
    </text>

    <!-- Status Badge -->
    <g transform="translate(0, 84)">
      <rect x="-70" y="-12" width="140" height="24" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="-48" cy="0" r="3.5" fill="#facc15"/>
      <text x="6" y="4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#facc15" text-anchor="middle" letter-spacing="0.08em">
        PENDING CAPTURE
      </text>
    </g>
  </g>

  <!-- Framing Border -->
  <rect x="2" y="2" width="1596" height="896" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
